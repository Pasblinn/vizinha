<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - yoosee-nvr</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%2300d4ff'/><circle cx='8' cy='8' r='3' fill='%230a0a0f'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: #12121a;
            border: 1px solid #1a1a2e;
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            max-width: 100%;
        }
        .login-box h1 { color: #00d4ff; font-size: 1.3em; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #888; text-align: center; font-size: 0.85em; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #888; font-size: 0.85em; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            outline: none;
        }
        .form-group input:focus { border-color: #00d4ff; }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0f3460, #00d4ff);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .error {
            background: #ff444433;
            color: #ff4444;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .lock-icon { text-align: center; font-size: 2.5em; margin-bottom: 15px; }
    </style>
</head>
<body>
    <main class="login-box">
        <div class="lock-icon" aria-hidden="true">&#128274;</div>
        <h1>yoosee-nvr</h1>
        <p class="subtitle">Restricted access</p>
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Sign in</button>
        </form>
    </main>
</body>
</html>
